name: shout

instance_groups:
- name: shout
  instances: 1
  vm_type: default
  stemcell: default
  azs: [z1]
  networks: [{name: default}]
  persistent_disk: 1024

  jobs:
  - name: shout
    release: shout
    properties:
      ops:
        username: ops
        password: ((shout_ops_password))
      admin:
        username: admin
        password: ((shout_admin_password))
      rules:
        vars:
          webhook: ((slack_webhook))
        rules:
        - for: "*"
          when:
          - match: "*"
            remind: 24h
            do:
            - slack:
                webhook: "{{ .Vars.webhook }}"
                text:    "{{ .Topic }} is {{ .Status }}"
                color:   '{{ if .OK }}good{{ else }}danger{{ end }}'
                attach:  '{{ if .Link }}{{ .Message }} <{{ .Link }}>{{ else }}{{ .Message }}{{ end }}'

variables:
- name: shout_ops_password
  type: password
- name: shout_admin_password
  type: password

update:
  canaries: 1
  canary_watch_time: 1000-60000
  max_in_flight: 1
  serial: true
  update_watch_time: 1000-60000

stemcells:
- alias: default
  # The binary is static, so ubuntu-jammy, ubuntu-noble, and ubuntu-resolute
  # stemcells all work.
  os: ubuntu-noble
  version: latest

releases:
- name: shout
  version: latest
